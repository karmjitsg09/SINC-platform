<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/sinc-official-logo.png" />
    <link rel="apple-touch-icon" href="/images/sinc-official-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#080E18" />
    <meta name="description" content="SINC Platform — Next-generation technology community and professional networking platform." />
    <title>SINC — Technology & Developer Network</title>
    
    <!-- Immediate theme initializer to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sinc_theme') || 'dark';
          var effective = saved;
          if (saved === 'system') {
            effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.classList.add('theme-' + effective);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
