<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sincGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- High-tech SINC 'S' ribbon and network node constellation -->
  <path d="M 44 20 C 44 14 38 12 32 12 C 24 12 18 16 18 23 C 18 31 32 32 32 38 C 32 43 27 45 22 44 C 18 43 16 40 16 38"
        fill="none" 
        stroke="url(#sincGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Connected Network Dots -->
  <circle cx="44" cy="20" r="3.5" fill="#38bdf8" />
  <circle cx="18" cy="23" r="3" fill="#60a5fa" />
  <circle cx="32" cy="38" r="3" fill="#818cf8" />
  <circle cx="16" cy="38" r="3.5" fill="#a855f7" />

  <!-- Center pulse accent -->
  <circle cx="46" cy="44" r="2.5" fill="#38bdf8" opacity="0.8" />
</svg>
